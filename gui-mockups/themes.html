<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1280px;height:720px;overflow:hidden;font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:12px;color:#e9ecf2;
 background:linear-gradient(180deg,#3d5f8f 0%,#6f93bd 38%,#9db7d3 52%,#4b7a3d 52.2%,#3c6a30 70%,#2c4f25 100%);position:relative}
.world{position:absolute;inset:0;background:
 radial-gradient(circle at 18% 22%,rgba(255,255,255,.55) 0 30px,transparent 32px),
 radial-gradient(circle at 70% 16%,rgba(255,255,255,.35) 0 44px,transparent 46px),

/* ---------- AKTUELL (Basis) ---------- */
.cur{--acc:#e53935;--acc2:#ff8a3d;--text:#e9ecf2;--text2:#aab0bf;--muted:#8c93a4;--off:#252a35;--line:#2a2f3b}

/* ---------- A: GLAS ---------- */
.glas{--acc:#6ea8ff;--acc2:#b48cff;--text:#fff;--text2:#c9d2e6;--muted:#9aa6c0;--off:rgba(255,255,255,.14);--line:rgba(255,255,255,.18)}

/* ---------- B: FLACH MINIMAL ---------- */
.flat{--acc:#2ee6a6;--acc2:#2ee6a6;--text:#f4f6fb;--text2:#7d8596;--muted:#6a7183;--off:#1b1f29;--line:#262b36}

.flat .mod:not(.on) .sw{opacity:.0}.flat .mod.on .sw{width:8px;height:8px;border-radius:50%;background:var(--acc)}.flat .sw::after{display:none}
.flat .search,.flat .bar .title{background:#0b0d12;border:1px solid #1c2029;border-radius:3px;height:28px;display:flex;align-items:center;padding:0 12px}

/* ---------- C: NEON VERLAUF ---------- */

.neon .head{height:36px;background:linear-gradient(90deg,rgba(255,61,129,.55),rgba(122,92,255,.55));border-radius:10px 10px 0 0;text-shadow:0 0 8px rgba(255,255,255,.5)}

.term{--acc:#35ff6b;--acc2:#35ff6b;--text:#b8ffc9;--text2:#4fbf6a;--muted:#2f8a45;--off:#06210f;--line:#14502a;font-family:"DejaVu Sans Mono",Consolas,monospace;font-size:11px}

.pixel{--acc:#55c23a;--acc2:#3b8a28;--text:#fff;--text2:#e0e0e0;--muted:#b9b9b9;--off:#4a4a4a;--line:#202020;font-family:"DejaVu Sans Mono",monospace;font-weight:700;font-size:11px}

.pixel .search,.pixel .bar .title{background:#000;border:2px solid #a0a0a0;border-radius:0;height:28px;display:flex;align-items:center;padding:0 10px;color:#fff}
.pixel .settings{background:#5a5a5a;border:2px solid #000;margin-top:3px;color:#fff}
.pixel .slider,.pixel .slider i,.pixel .slider b,.pixel .sel,.pixel .chip{border-radius:0}.pixel .slider{height:8px;border:2px solid #000;background:#222}

/* ---------- G: PAPIER HELL ---------- */
.paper{--acc:#1f8a70;--acc2:#e8a33d;--text:#1d2530;--text2:#4b5668;--muted:#8a94a6;--off:#dfe3ea;--line:#d5dae3;color:#1d2530}
.paper body,.paper{background:linear-gradient(180deg,#9fc7ee 0%,#c9e0f5 40%,#79b05f 40.2%,#5f9a47 100%)}

.bp .head{height:30px;text-transform:uppercase;letter-spacing:2px;color:var(--acc);border-bottom:1px solid var(--line);background:rgba(8,36,80,.7)}
.bp .mod{height:24px;border-bottom:1px dotted rgba(140,190,255,.25)}
.bp .mod.on{color:#fff}.bp .mod.on .nm::before{content:"◆ ";color:var(--acc)}.bp .mod:not(.on) .nm::before{content:"◇ ";color:var(--muted)}

/* ---------- J: SPOTLIGHT (mittig, Tabs) ---------- */

</style></head>

 const tiles=cats[2][2].concat(cats[1][2].slice(0,3)).map(([m,k,on])=>`<div class="tile ${on?'on':''}"><div class="nm">${m}</div><div class="ds">${descs[m]||''}</div><span class="sw"></span>${k?`<span class="key">${k}</span>`:''}</div>`).join('');
 document.body.insertAdjacentHTML('beforeend',`<div class="win"><div class="nav"><div class="logo">DIHClient</div>${nav}<div class="it" style="margin-top:auto"><i>☰</i>Einstellungen</div></div><div class="main"><div class="top"><h2>Automation</h2><div class="search">Module suchen …</div></div><div class="grid">${tiles}</div></div></div>`);
} else if(v==='spot'){
 document.querySelector('.panels').style.display='none';document.querySelector('.bar').style.display='none';
 const tabs=cats.map((c,i)=>`<div class="tb ${i==2?'sel2':''}">${c[1]} ${c[0]}</div>`).join('');
 const items=cats[2][2].concat(cats[0][2].slice(0,4)).map(([m,k,on,open])=>`<div class="it2 ${on?'on':''} ${open?'cur2':''}"><span>${m}</span><span class="sw" style="${on?'background:var(--acc)':''}"></span></div>`).join('');
 document.body.insertAdjacentHTML('beforeend',`<div class="win"><div class="tabs">${tabs}</div><div class="searchrow"><div class="search">Module suchen …</div></div><div class="body"><div class="list">${items}</div><div class="info"><h3>Miner</h3><p>Erze oder Tunnel. Mode: Ores</p>${settingsHTML}</div></div></div>`);
} else {
 for(const [n,ic,mods,sub] of cats){
  h+=`<div class="panel"><div class="head"><span class="ic">${ic}</span><span class="n0">${n}</span><span class="n">${mods.filter(m=>m[2]).length}/${mods.length}</span></div>`;
  for(const [m,k,on,open] of mods){
   h+=`<div class="mod ${on?'on':''}"><div><div class="nm">${m}</div>${v=='card'?`<div class="desc">${descs[m]||''}</div>`:''}</div><div class="right">${k?`<span class="key">${k}</span>`:''}<span class="sw"></span></div></div>`;
   if(open) h+=settingsHTML;
  }
  h+='</div>';
 }
 document.getElementById('p').innerHTML=h;
 if(v!='card')document.querySelectorAll('.head .ic').forEach(e=>e.style.display='none');
 if(v=='card')document.querySelectorAll('.head .n0').forEach(e=>e.style.fontWeight=700);
}
